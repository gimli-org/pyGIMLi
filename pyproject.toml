[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "pygimli._version.__version__"}

[tool.setuptools.packages.find]
# where = ["./"]  # list of folders that contain the packages (["."] by default)
include = ["pygimli*", "pygimli.*"]
exclude = ["core*", 'apps']

[project]
name = "pygimli"
dynamic = ["version"]
#version = "2.0b1"
requires-python = ">=3.11"

authors = [
  { name = "Carsten Rücker" },
  { name = "Thomas Günther" },
  { name = "Florian Wagner" },
  { email = "mail@pygimli.org" },
]
description = "Geophysical Inversion and Modelling Library"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.md"]
keywords = [
    "Geophysical Inversion",
    "Geophysical Modelling"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "setuptools>=75.8.2",
    "scooby",
    "pgcore==2.0b6",
    "numpy>=2.4.0",
    "scipy<1.18", # 1.18 forces py>3.11 (build-runner)
    "matplotlib",
]

[project.optional-dependencies]
build = [
    "pygccxml",
    "pyplusplus",
    "build",
    "twine",
    "wheel",
    "auditwheel; sys_platform == 'linux'",
    "delvewheel; sys_platform == 'win32'",
    "delocate; sys_platform == 'darwin'",
]
opt = [
    "ipython",
    "meshio",
    "pyvista[all]",
    "tetgen>=0.6.5",
    "tabulate",
    "tqdm",
]
test = [
    "pygimli[opt]",
    "tox",
    "ruff",
    "coverage[toml]",
    "pytest>=6.0",
    "pytest-cov",
    "pytest-html",
    "pytest-xdist",
]
doc = [
    "pygimli[test]",
    "bibtexparser",
    "jupytext",
    "joblib",
    "linkify-it-py",
    "myst_nb",
    "pydata-sphinx-theme",
    "gmsh",
    "sphinx>=7.2",
    "sphinxcontrib-bibtex",
    "sphinxcontrib-doxylink",
    "sphinxcontrib-programoutput",
    "sphinx-gallery",
    "sphinx_design",
    "sphinx-copybutton",
    "sphinx-syntax-example",
]
dev = [
    "pygimli[build, opt, test, doc]",
    "pre-commit",
]
all = [
    "pygimli[dev]",
]

[project.urls]
Homepage = "https://www.pygimli.org"
Documentation = "https://www.pygimli.org/documentation.html"
Repository = "https://github.com/gimli-org/gimli"
"Bug Tracker" = "https://github.com/gimli-org/gimli/issues"
Changelog = "https://github.com/gimli-org/gimli/releases"

[tool.uv.extra-build-dependencies]
pygimli = ["numpy"]

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "pygimli/_version.py"
versionfile_build = "pygimli/_version.py"
tag_prefix = "v"
parentdir_prefix = "pygimli-"

[tool.tox]
    requires = ["tox>=4.27"]
    envlist = [
        "py313",
        "ruff",
    ]

    [tool.tox.env_run_base]
        description = "Run test under {base_python}"
        commands = [["pytest"]]

[tool.tox.ruff]
labels = ["ruff"]

[tool.coverage.run]
branch = true
omit = [
    "pygimli/testing/*",
]

[tool.coverage.report]
exclude_lines = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self.debug:",
    "if debug:",
    "if DEBUG:",
    "if pg.core.deepDebug() == -1:",
    "pg.critical",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if False:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = 'py313'

exclude = [
    "__pycache__",
    ".venv",
    ".venv-py310",
    ".venv-py311",
    ".venv-py312",
    ".venv-py313",
    ".venv-py314",
    # generated/vendored files, not maintained here (was `ignore` in .pylintrc)
    "_version.py",
    "versioneer.py",
]

line-length = 80

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "D",  # pydocstyle
    "E",  # Error
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "PGH",  # pygrep-hooks
    "PTH", # flake8-use-pathlib
    "Q",  # flake8-quotes
    "S",  # bandit
    "SIM",  # flake8-simplify
    "TRY",  # tryceratops
    "UP",  # pyupgrade
    "W",  # Warning
    "YTT", # flake8-2020
]

ignore = [
    "C408", # Allow use dic(**kwargs)
    "E731", # Allow simple lambda function generators
    "E741", # Allow use of l I o, variable names
    "I001",  # Allow unsorted imports
    "N802",  # Allow "as" name should be lowercase
    "N803",  # Allow name should be lowercase
    "N806",  # Allow name should be lowercase
    "N816",  # Allow mixedCase module level variables
    "N999",  # Allow "wrong" modulname
    "Q000",  # Allow single quotes in docstrings
    "S110",  # Allow use of except/pass
    "S301",  # Disable warning for use of pickle (security warning)
    "SIM105", # all try: BaseException except: pass
    "SIM114", # no need for logical if branches
    "SIM223", # Allow if 0 and ...
    "TRY003",  # Avoid specifying messages outside exception class; overly strict, especially for ValueError
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "chr",
    "typer.Argument",
    "typer.Option",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    # package entry points are re-export hubs
    "E402",  # imports after code on purpose
    "F401",  # re-export of names
    "F403",  # from x import *
    "F405",  # name may be defined from star import
    "N801",  # legacy public class names (tictoc, pygimli, ...)
]
"pygimli/core/matrix.py" = [
    # public API hub: names are re-exported for pygimli.core and friends
    "F401",  # re-export of core classes (RVector, MatrixBase, ...)
]
"pygimli/core/math.py" = [
    # public API hub: re-exported as pygimli.math.* (see pygimli/__init__.py)
    "F401",  # re-export of math functions from pygimli.core
]
"pygimli/core/datacontainer.py" = [
    # dataMap() is a C++ std::map: iterating yields (key, value) tuples, so
    # .keys() cannot be dropped
    "SIM118",
]
"pygimli/core/mesh.py" = [
    # dataMap() is a C++ std::map: iterating yields (key, value) tuples, so
    # .keys() cannot be dropped
    "SIM118",
]
"pygimli/math/matrix.py" = [
    # public API hub: re-exported as pygimli.matrix.* (see pygimli/__init__.py)
    "F401",  # re-export of matrix helpers from pygimli.core.matrix
]
"core/python/hand_made_wrappers.py" = [
    "E501",  # embedded C++ code strings are not wrapped
]
"doc/conf.py" = [
    # Sphinx configuration: imports must follow the sys.path setup and the
    # generated conf_environment is star-imported
    "B018",  # useless expression (latex preamble probe)
    "D103",  # missing docstring
    "E402",  # imports not at top of file
    "E501",  # long option strings
    "F401",  # feature probes via import
    "F403",  # star import of generated config
    "F405",  # names from star import
    "PTH100",  # os.path.abspath
    "PTH110",  # os.path.exists
    "PTH118",  # os.path.join
    "PTH123",  # open
    "S603",  # subprocess call for the doxygen build
    "SIM115",  # open without context manager
]
"doc/**" = [
    # sphinx-gallery examples start with an RST heading that is rendered as
    # the example title. pydocstyle reads that heading as summary line
    # without trailing period and without blank line before the description.
    "D205",  # 1 blank line required between summary line and description
    "D400",  # first line should end with a period
]

[tool.ruff.lint.pep8-naming]
staticmethod-decorators = [
    "pydantic.validator",
    "pydantic.root_validator",
]

[tool.codespell]
# Spelling check for comments, docstrings and documentation. Used by the
# `codespell` pre-commit hook and for manual runs over the whole tree:
#     codespell --toml pyproject.toml
# The ignore list holds identifiers, acronyms, author names, German words
# from the source comments and the journal abbreviation "Int. J. Numer.".
skip = [
    # build artefacts, scratch and generated files (matched as directory names)
    "build",
    "tmp",
    "pygimli.egg-info",
    # bundled third party code
    "kdtree++",
    # binary/data formats, vendored web assets and notebooks (outputs are not
    # maintained here)
    "*.ipynb",
    "*.pyc",
    "*.vtu",
    "*.vtk",
    "*.poly",
    "*.msh",
    "*.bms",
    "*.ves",
    "*.vector",
    "*.pdf",
    "*.png",
    "*.jpg",
    "*.svg",
    "*.css",
    "*.js",
]
# BibTeX protects capitals as {F}requency and spells accents as {\"a}rger,
# which splits words for the checker; the protected form is stripped first.
# Single quotes keep the backslashes readable (literal TOML string).
ignore-regex = '\{[A-Za-z]\}[A-Za-z]+|\{\\[^}]*\}[A-Za-z]*'
ignore-words-list = [
    "nd",  # loop/iterator variable in C++ code
    "codespell",
    "modelL", "modelLS", "NodeL",  # variable names
    "aline", "eNew", "eSpacing", "inot", "inout", "nam", "pres", "siz",
    "uE", "valU", "childs", "listin", "onlyOnce",  # variable names
    "COO", "NED", "TE",  # sparse matrix format, North-East-Down, transverse
    "notin",  # LaTeX \notin in formula markup
    "feld",  # German "Feld" in translation strings (units.py)
    "SAEM",  # semi-airborne electromagnetics
    "Numer",  # "Int. J. Numer. Meth. Engng." in a reference
    "Hadler", "Thi",  # author names in citations
    "Thirdparty", "ThirdParty", "thirdParty",  # directory/variable names
]
